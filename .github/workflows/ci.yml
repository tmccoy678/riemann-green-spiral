name: Lean and provenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify preserved artifacts
        run: sha256sum --check MANIFEST.sha256
      - name: Verify path 22 witness against exported samples
        run: python3 scripts/verify_witness.py
      - name: Bind photon-channel receipts to Lean certificates
        run: python3 scripts/verify_photon_certificate.py
      - name: Audit complete channel and neighborhood data in Rust
        run: cargo run --release --manifest-path rust/path22-audit/Cargo.toml
      - name: Falsification tests for the Rust data bridge
        run: cargo test --release --manifest-path rust/path22-audit/Cargo.toml
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          axiom-audit: true
      - name: Run checked summary
        run: lake exe riemann
